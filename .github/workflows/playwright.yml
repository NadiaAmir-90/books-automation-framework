name: Playwright UI Automation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare artifact directories
        run: |
          mkdir -p reports allure-results allure-report
          mkdir -p test-results screenshots videos traces

      - name: Run tests and generate HTML report
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest \
            --html=reports/report.html \
            --self-contained-html \
            --alluredir=allure-results \
            --clean-alluredir \
            --output=test-results \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -n "$(find allure-results -type f -print -quit)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results were generated."
          fi

      - name: Upload test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          if-no-files-found: warn
          path: |
            reports/
            allure-results/
            allure-report/
            test-results/
            screenshots/
            videos/
            traces/

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
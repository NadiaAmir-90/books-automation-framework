
name: Playwright UI Automation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js for Allure CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare artifact directories
        run: |
          mkdir -p reports allure-results allure-report
          mkdir -p test-results screenshots videos traces

      - name: Run tests and generate HTML report
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest \
            --html=reports/report.html \
            --self-contained-html \
            --alluredir=allure-results \
            --clean-alluredir \
            --output=test-results \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -n "$(find allure-results -type f -print -quit)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results were generated."
          fi

      - name: Prepare GitHub Pages site
        if: always()
        run: |
          mkdir -p public/playwright public/allure

          if [ -f reports/report.html ]; then
            cp reports/report.html public/playwright/index.html
          fi

          if [ -f allure-report/index.html ]; then
            cp -a allure-report/. public/allure/
          fi

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Automation Test Reports</title>
          </head>
          <body>
            <h1>Automation Test Reports</h1>
            <ul>
              <li><a href="./playwright/">Playwright HTML Report</a></li>
              <li><a href="./allure/">Allure Report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload reports for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public

      - name: Upload test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          if-no-files-found: warn
          path: |
            reports/
            allure-results/
            allure-report/
            test-results/
            screenshots/
            videos/
            traces/

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
